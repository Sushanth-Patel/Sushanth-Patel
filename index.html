<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sushanth Patel — Web Developer, AI/ML Enthusiast, and Backend Developer.">
    <title>Sushanth Patel | AI Developer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #080808;
        }

        body {
            overflow-x: hidden;
        }

        .homepage {
            position: relative;
            width: 100%;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: clamp(16px, 3vw, 44px);
            overflow: hidden;
            background: #080808;
        }

        .artwork-frame {
            position: relative;
            width: min(100%, 1600px);
            aspect-ratio: 1365 / 768;
        }

        .homepage-artwork {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 20px;
            filter: contrast(1.14) saturate(1.12) brightness(1.03);
            image-rendering: auto;
        }

        .bar-links {
            position: absolute;
            top: 91%;
            left: 36%;
            width: 29%;
            height: 8%;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            padding: 0 1%;
        }

        .bar-link {
            display: block;
            width: 13%;
            border-radius: 50%;
            outline: none;
        }

        .bar-link:focus-visible {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.9), 0 0 0 6px #ff633f;
        }

        .role-replacement {
            display: none;
        }

        .role-replacement::before {
            display: none;
        }

        @media (max-width: 700px) {
            .homepage {
                min-height: 100svh;
                padding: 10px;
            }

            .artwork-frame {
                width: 100%;
            }

            .homepage-artwork {
                border-radius: 12px;
            }

            .bar-links {
                top: 90.5%;
                left: 35%;
                width: 30%;
                height: 9%;
            }

            .bar-link {
                width: 12%;
            }
        }

        @media (max-width: 420px) {
            .homepage {
                padding: 6px;
            }

            .homepage-artwork {
                border-radius: 8px;
            }

            .bar-links {
                top: 89.5%;
                left: 34%;
                width: 32%;
                height: 10%;
            }
        }
    </style>
</head>
<body>
    <main class="homepage">
        <div class="artwork-frame">
            <img
                class="homepage-artwork"
                src="sushanth-home.png"
                alt="Sushanth Patel AI Builder portfolio introduction">
            <nav class="bar-links" aria-label="Portfolio shortcuts">
                <a class="bar-link" href="index.html" aria-label="Home"></a>
                <a class="bar-link" href="portfolio.html#about" aria-label="About Sushanth"></a>
                <a class="bar-link" href="portfolio.html#skills" aria-label="Technical skills"></a>
                <a class="bar-link" href="portfolio.html#projects" aria-label="Projects"></a>
                <a class="bar-link" href="portfolio.html#credentials" aria-label="Certificates"></a>
                <a class="bar-link" href="https://github.com/Sushanth-Patel" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile"></a>
                <a class="bar-link" href="portfolio.html#contact" aria-label="Contact"></a>
            </nav>
        </div>
    </main>
</body>
</html>
